# Detect social media / link-preview crawlers.
# These bots don't execute JS, so we redirect them to the Edge Function
# that returns proper OG meta tags for the store.
map $http_user_agent $is_crawler {
    default                         0;
    "~*Twitterbot"                  1;
    "~*facebookexternalhit"         1;
    "~*WhatsApp"                    1;
    "~*TelegramBot"                 1;
    "~*LinkedInBot"                 1;
    "~*Slackbot"                    1;
    "~*Discordbot"                  1;
    "~*pinterest"                   1;
    "~*Googlebot"                   1;
    "~*bingbot"                     1;
    "~*DuckDuckBot"                 1;
    "~*iframely"                    1;
    "~*vkShare"                     1;
    "~*W3C_Validator"               1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── OG preview redirect for store URLs ───────────────────────────────────
    # Matches /{slug} and /{slug}/* excluding admin/static paths.
    # Crawlers are redirected to the Supabase Edge Function which returns OG HTML.
    # Real browsers continue to the SPA via try_files.
    # SUPABASE_FUNCTIONS_URL is substituted by envsubst at container startup.
    location ~ ^/(?!admin|auth|api|assets|static|sw\.js|manifest\.webmanifest|favicon|logo|og-)([\w-]+)(/.*)?$ {
        set $slug $1;

        if ($is_crawler = 1) {
            return 302 ${SUPABASE_FUNCTIONS_URL}/og-preview/$slug;
        }

        try_files $uri $uri/ /index.html;
    }

    # Handle React Router (SPA) — catch-all
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
