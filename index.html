<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Primary Meta Tags -->
    <!-- description, og:title, og:description y canonical se manejan en runtime vía
         react-helmet-async (default en PublicStoreLayout.tsx, override por página) — se
         sacaron de este HTML estático para no duplicar el tag una vez que Helmet corre.
         <title> se deja estático: Helmet lo pisa con document.title (sin duplicar), así
         que sirve de fallback real para el instante antes de que cargue el JS.
         Nota: crawlers que no ejecutan JS (previews de WhatsApp/Twitter/Facebook) solo ven
         este HTML estático — description/og:*/canonical NO varían por producto/categoría
         para esos casos hasta que el proyecto tenga SSR o prerender. Ver .claude/TODO.md. -->
    <title>Ruemia — Mates artesanales</title>
    <meta name="title" content="Ruemia — Mates artesanales" />
    <meta name="keywords" content="mates artesanales, mates de cuero, mates bordados, regalos artesanales Uruguay, mate uruguayo, artesanía uruguaya" />
    <meta name="author" content="Ruemia" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="language" content="Spanish" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA / Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ruemia" />
    <meta name="application-name" content="Ruemia" />
    <meta name="msapplication-starturl" content="/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:image:alt" content="Ruemia — mates artesanales" />
    <meta property="og:locale" content="es" />
    <meta property="og:site_name" content="Ruemia" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ruemia — Mates artesanales" />
    <meta name="twitter:description" content="Mates artesanales de cuero y detalles bordados, hechos en Uruguay. Las piezas con historia merecen ser parte de nuevos momentos." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Ruemia — mates artesanales" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#46362B" />
    <meta name="msapplication-TileColor" content="#46362B" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data (JSON-LD) — un único bloque Organization (antes había
         dos duplicados con distinto `logo` y sin `url`/`sameAs`, señal
         ambigua para Google). `logo` usa og-image.png (1200x1200, el logo/OG
         real) en vez de apple-touch-icon.png (180x180, solo el ícono táctil). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Ruemia",
      "url": "https://ruemia.uy",
      "description": "Mates artesanales de cuero y detalles bordados, hechos en Uruguay.",
      "logo": "https://ruemia.uy/og-image.png",
      "sameAs": [
        "https://www.instagram.com/ruemia.uy/",
        "https://www.facebook.com/ruemia.uy/"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => {
              console.log('Service Worker registrado:', reg);
            })
            .catch((err) => {
              console.log('Service Worker registration error:', err);
            });
        });
      }
    </script>
  </body>
</html>
