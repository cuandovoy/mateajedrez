server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Dominio canónico: www.mateajedrez.uy -> https://mateajedrez.uy (301). Basado en el
    # header Host, no en el esquema/puerto: este bloque solo escucha :80 y no
    # termina TLS (no hay directivas ssl_*), así que en producción hay un
    # proxy/load balancer delante que termina TLS y reenvía acá preservando el
    # Host original — el redirect por Host funciona sin importar dónde se
    # resuelva el certificado.
    if ($host = www.mateajedrez.uy) {
        return 301 https://mateajedrez.uy$request_uri;
    }

    # robots.txt y sitemap.xml deben servirse como archivos reales, con el
    # Content-Type correcto, y nunca caer al fallback de index.html del SPA
    # (bug original: al no existir como archivos, cualquier bot recibía el
    # shell HTML con 200 OK). Van antes de `location /` a propósito.
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        # `types {}` vacío desactiva la resolución de Content-Type por
        # extensión vía mime.types (que mapea .xml a text/xml) para forzar
        # application/xml explícitamente en este location.
        types { }
        default_type application/xml;
        try_files $uri =404;
    }

    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
